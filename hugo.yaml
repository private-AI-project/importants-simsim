baseURL: "https://simsim.importants-studio.com/"
locale: "ko-kr"
defaultContentLanguage: "ko"
title: "심심풀이"

disableKinds: ["taxonomy", "term"]

enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 24

params:
  googleAnalytics: "G-WFXTXX3YR2"
  naverVerification: "6dca2c8353014489c350393654a682f20d9d1fe5"
  description: "심심할 때 하나씩. 성격 테스트, 밸런스 게임, 상식 퀴즈."
  defaultOgImage: "/images/og-default.png"

markup:
