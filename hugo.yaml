baseURL: "https://simsim.importants-studio.com/"
locale: "ko-kr"
defaultContentLanguage: "ko"
title: "심심풀이"

disableKinds: ["taxonomy", "term"]

enableRobotsTXT: true
enableEmoji: true

pagination:
  pagerSize: 24

params:
  author: "Importants Studio"
  googleAnalytics: "G-WFXTXX3YR2"
  bingVerification: "62BB68AE741249DAC7041EA5ED6E8EF4"
  naverVerification: "6dca2c8353014489c350393654a682f20d9d1fe5"
  description: "심심할 때 하나씩. 커피 내기, 순서 정하기, 성격 테스트."
  defaultOgImage: "/images/og-default.png"

markup:
  goldmark:
    renderer:
      unsafe: false
    extensions:
      # 한글 물결표 범위(3~4일)를 취소선으로 먹어버려서 끈다.
      strikethrough: false

outputFormats:
  LLMS:
    mediaType: text/plain
    baseName: llms
    isPlainText: true

outputs:
  home: ["HTML", "RSS", "LLMS"]

sitemap:
  changefreq: weekly
  priority: 0.7

minify:
  tdewolff:
    html:
      # 배포는 hugo --minify 로 돈다. 속성값 따옴표를 벗기면
      # name=msvalidate.01 처럼 점이 든 값을 빙 소유확인 파서가 못 읽는다.
      keepQuotes: true
