{{ define "main" }}
<article class="game">
    <p class="quiz-cat">{{ .Params.category }}</p>
    <h1>{{ .Title }}</h1>

    <section id="rl-setup">
        <p class="lead">한 명만 뽑습니다. 같은 사람이 연달아 걸리지 않게 막아둡니다.</p>

        <div class="sv-group">
            <p class="sv-step">누가 참여하나요<span>최대 12명</span></p>
            <div class="add-row">
                <input type="text" id="rl-input" placeholder="이름 입력" maxlength="10"
                       autocomplete="off" spellcheck="false" aria-label="참가자 이름">
                <button type="button" class="btn primary small" id="rl-add">추가</button>
            </div>

            <div class="roster-head" id="rl-roster-head" hidden>
                <span id="rl-roster-count">참가자</span>
                <span class="hidden-note">직전 당첨자는 후보에서 빠집니다</span>
            </div>
            <ul class="roster" id="rl-roster"></ul>
            <p class="roster-empty" id="rl-empty">이름을 넣으면 여기에 쌓입니다.</p>
        </div>

        <details class="stake-fold">
            <summary>무엇을 걸까요</summary>
            <input type="text" id="rl-stake" class="sv-stake" placeholder="예) 오늘 커피"
                   maxlength="24" autocomplete="off" aria-label="걸 것">
        </details>

        <button class="btn primary" id="rl-start" disabled>2명 이상 필요해요</button>

        <details class="rig-box">
            <summary>방장만 보세요 <span class="rig-badge" id="rl-rig-badge" hidden>설정됨</span></summary>
            <p class="rig-warn">정해두면 바늘이 그 칸에 섭니다.</p>
            <div class="rig-row">
                <select id="rl-rig-target"><option value="">조작 안 함</option></select>
                <select id="rl-rig-mode">
                    <option value="lose">이 사람 당첨</option>
                </select>
            </div>
        </details>
    </section>

    <section id="rl-stage" hidden>
        <canvas id="rl-canvas" width="420" height="420" aria-label="돌림판"></canvas>

        <div class="result-panel" id="rl-result" hidden>
            <p class="verdict" id="rl-verdict"></p>
            <div class="result-actions">
                <button class="btn ghost small" id="rl-copy">결과 복사</button>
                <button class="btn ghost small" id="rl-reset">명단 고치기</button>
                <button class="btn primary" id="rl-again">다시 돌리기</button>
            </div>
        </div>
    </section>

    {{ with .Content }}<div class="game-desc">{{ . }}</div>{{ end }}
</article>

<script src="{{ "js/party.js" | relURL }}" defer></script>
<script src="{{ "js/roulette.js" | relURL }}" defer></script>
{{ end }}
