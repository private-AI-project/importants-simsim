{{ define "main" }}
<section class="hero">
    <h1>게임</h1>
    <p>점수로 겨루는 것들.</p>
</section>

<div class="quiz-grid">
    {{ range .RegularPages.ByWeight }}
    <a class="quiz-card" href="{{ .RelPermalink }}">
        <span class="quiz-emoji">{{ default "🕹️" .Params.emoji }}</span>
        <span class="quiz-cat">{{ .Params.category }}</span>
        <strong class="quiz-title">{{ .Title }}</strong>
    </a>
    {{ else }}
    <p class="empty">준비 중입니다.</p>
    {{ end }}
</div>
{{ end }}
